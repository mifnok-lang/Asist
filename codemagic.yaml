workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Prepare Gradle
        script: |
          cd android
          chmod +x gradlew

      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease --stacktrace --info --no-daemon > build.log 2>&1
          cat build.log

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/build.log
